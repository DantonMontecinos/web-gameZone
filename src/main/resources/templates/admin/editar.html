<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil | VideoGamesHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: #e5e7eb;
        }

        .navbar {
            background-color: #020617;
            border-bottom: 1px solid #1e293b;
        }

        .brand {
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
        }

        .card-pro {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 14px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }

        .form-control,
        textarea {
            background-color: #020617;
            border: 1px solid #334155;
            color: #e5e7eb;
        }

        .form-control:focus,
        textarea:focus {
            border-color: #38bdf8;
            box-shadow: none;
            background-color: #020617;
            color: #e5e7eb;
        }

        .btn-primary {
            background-color: #38bdf8;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0ea5e9;
        }

        footer {
            border-top: 1px solid #1e293b;
            background-color: #020617;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand brand" th:href="@{/index}">VideoGamesHub</a>
        <span class="navbar-text text-muted">
            Editar perfil
        </span>
    </div>
</nav>

<!-- Content -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card-pro p-4">
                <div class="text-center mb-4">
                    <h3>Editar Perfil</h3>
                    <p class="text-muted">Actualizá tu información personal</p>
                </div>

                <form th:action="@{/jugadores/actualizar}"
                      th:object="${jugador}"
                      method="post">

                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control"
                               name="nombre"
                               th:field="*{nombre}" required>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control"
                               name="apellido"
                               th:field="*{apellido}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control"
                               name="email"
                               th:field="*{email}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" class="form-control"
                               name="usuario"
                               th:field="*{usuario}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control"
                               name="password"
                               th:field="*{password}"
                               placeholder="Dejar vacío para no cambiarla">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date" class="form-control"
                               name="fechaNacimiento"
                               th:field="*{fechaNacimiento}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" rows="3"
                                  name="descripcion"
                                  th:field="*{descripcion}"></textarea>
                    </div>



                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Guardar cambios
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<!-- Footer -->
<footer class="py-3 text-center text-muted">
    <small>&copy; 2024 VideoGamesHub</small>
</footer>

</body>
</html>
