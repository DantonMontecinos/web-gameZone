<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inicio | Página de Videojuegos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

        <style>
    body {
        background-color: #121212; /* Negro neutro */
        color: #e0e0e0; /* Gris claro */
        display: flex;
        flex-direction: column;
        min-height: 100vh; /* Asegura que el body cubra toda la altura */
        margin: 0; /* Elimina márgenes por defecto */
    }

    .navbar {
        background-color: #1f1f1f; /* Gris oscuro */
    }

    .main-content {
        flex: 1; /* Hace que el contenido ocupe el espacio restante */
        margin-top: 20px;
    }

    .footer {
        background-color: #1f1f1f; /* Gris oscuro */
        color: #e0e0e0; /* Gris claro */
        padding: 20px 0;
        text-align: center;
    }

    .card {
        background-color: #282828;
        color: #e0e0e0;
    }
</style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/index}">VideoGamesHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <span class="navbar-text">
                    ¡Conecta y juega!
                </span>
            </div>
        </div>
    </nav>

        
        
        <!-- Formulario para crear el usuario -->
        <div class="container main-content">
            <h1 class="text-center mb-4">Editar Perfil</h1>
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title text-center">Formulario de Edición</h5>
                            <!-- Acción dirigida al método del controlador para guardar los cambios -->
                            <form th:action="@{/jugadores/actualizar/{id}(id=${jugador.id})}" method="post">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre"
                                           th:value="${jugador.nombre}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="apellido" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" name="apellido"
                                           th:value="${jugador.apellido}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                           th:value="${jugador.email}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="usuario" class="form-label">Nombre de Usuario</label>
                                    <input type="text" class="form-control" id="usuario" name="usuario"
                                           th:value="${jugador.usuario}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password"
                                           th:placeholder="'Cambiar contraseña (opcional)'" >
                                </div>
                                <div class="mb-3">
                                    <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                                    <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento"
                                           th:value="${jugador.fechaNacimiento}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="descripcion" class="form-label">Descripción del Jugador</label>
                                    <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                                              th:text="${jugador.descripcion}"></textarea>
                                </div>
                                <div class="text-center">
                                    <form th:action="@{/jugadores/actualizar/{id}(id=${jugador.id})}" method="post">
                                        <button type="submit" class="btn btn-outline-primary">Guardar Cambios</button>
                                    </form>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
    <footer class="footer mt-5">
        <div class="container">
            <p>&copy; 2024 VideoGamesHub. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
