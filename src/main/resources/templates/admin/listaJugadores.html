<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Jugadores por Juego | Game Project Zone</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar, footer {
            background-color: #1f1f1f;
        }

        .main-content {
            flex: 1;
            padding: 40px 0;
        }

        .accordion-item {
            background-color: #1c1c1c;
            border: none;
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .accordion-button {
            background-color: #1f1f1f;
            color: #fff;
            font-weight: bold;
        }

        .accordion-button:not(.collapsed) {
            background-color: #0d6efd;
            color: #fff;
        }

        .accordion-body {
            background-color: #1c1c1c;
        }

        .player-row {
            padding: 10px 15px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-row:last-child {
            border-bottom: none;
        }

        .badge-game {
            background-color: #6c757d;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Game Project Zone</a>
        <span class="navbar-text ms-auto">Jugadores activos</span>
    </div>
</nav>

<!-- Main -->
<main class="container main-content">

    <div class="text-center mb-5">
        <h1 class="fw-bold">🎮 Jugadores por juego</h1>
        <p class="text-muted">Explorá quién juega qué y unite a la comunidad</p>
    </div>

    <!-- Accordion de juegos -->
    <div class="accordion" id="accordionGames">

        <!-- Juego -->
        <div class="accordion-item">
            <h2 class="accordion-header" id="headingLol">
                <button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#lolPlayers">
                    League of Legends
                    <span class="badge ms-3 badge-game">MOBA</span>
                </button>
            </h2>
            <div id="lolPlayers" class="accordion-collapse collapse"
                 data-bs-parent="#accordionGames">
                <div class="accordion-body">

                    <!-- Jugador -->
                    <div class="player-row">
                        <div>
                            <strong>Juan Pérez</strong><br>
                            <small class="text-muted">@juanlol</small>
                        </div>
                        <a href="#" class="btn btn-outline-light btn-sm">Ver perfil</a>
                    </div>

                    <div class="player-row">
                        <div>
                            <strong>Ana Gómez</strong><br>
                            <small class="text-muted">@anagamer</small>
                        </div>
                        <a href="#" class="btn btn-outline-light btn-sm">Ver perfil</a>
                    </div>

                </div>
            </div>
        </div>

        <!-- Otro juego -->
        <div class="accordion-item">
            <h2 class="accordion-header" id="headingCs">
                <button class="accordion-button collapsed" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#csPlayers">
                    Counter Strike 2
                    <span class="badge ms-3 badge-game">FPS</span>
                </button>
            </h2>
            <div id="csPlayers" class="accordion-collapse collapse"
                 data-bs-parent="#accordionGames">
                <div class="accordion-body">

                    <div class="player-row">
                        <div>
                            <strong>Lucas Fernández</strong><br>
                            <small class="text-muted">@lucasfps</small>
                        </div>
                        <a href="#" class="btn btn-outline-light btn-sm">Ver perfil</a>
                    </div>

                </div>
            </div>
        </div>

    </div>

</main>

<!-- Footer -->
<footer class="text-center py-3">
    <small>&copy; 2024 Game Project Zone</small>
</footer>

</body>
</html>
