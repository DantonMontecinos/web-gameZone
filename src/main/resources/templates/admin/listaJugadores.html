<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Jugadores por Juego | Game Project Zone</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar, footer {
            background-color: #1f1f1f;
        }

        .main-content {
            flex: 1;
            padding: 40px 0;
        }

        .accordion-item {
            background-color: #1c1c1c;
            border: none;
            margin-bottom: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .accordion-button {
            background-color: #1f1f1f;
            color: #fff;
            font-weight: bold;
        }

        .accordion-button:not(.collapsed) {
            background-color: #0d6efd;
            color: #fff;
        }

        .accordion-body {
            background-color: #1c1c1c;
        }

        .player-row {
            padding: 10px 15px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-row:last-child {
            border-bottom: none;
        }

        .badge-game {
            background-color: #6c757d;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">Game Project Zone</a>
        <span class="navbar-text ms-auto">Jugadores activos</span>
    </div>
</nav>

<!-- Main -->
<main class="container main-content">

    <div class="text-center mb-5">
        <h1 class="fw-bold">🎮 Jugadores por juego</h1>
        <p class="text-muted">Explorá quién juega qué y unite a la comunidad</p>
    </div>

    <!-- Accordion de juegos -->
    <!-- Accordion de juegos -->
    <div class="accordion" id="accordionGames">

        <div class="accordion-item"
             th:each="juego : ${juegos}">

            <!-- Header del juego -->
            <h2 class="accordion-header"
                th:id="'heading-' + ${juego.id}">

                <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        th:data-bs-target="'#collapse-' + ${juego.id}"
                        aria-expanded="false"
                        th:aria-controls="'collapse-' + ${juego.id}">

                    <span th:text="${juego.nombre}">Nombre del juego</span>

                    <span class="badge ms-3 badge-game"
                          th:text="${juego.jugadores.size()} + ' jugadores'">
                    0 jugadores
                </span>

                </button>
            </h2>

            <!-- Collapse -->
            <div class="accordion-collapse collapse"
                 th:id="'collapse-' + ${juego.id}"
                 th:aria-labelledby="'heading-' + ${juego.id}"
                 data-bs-parent="#accordionGames">

                <div class="accordion-body">

                    <!-- Si no hay jugadores -->
                    <div th:if="${#lists.isEmpty(juego.jugadores)}"
                         class="text-muted">
                        No hay jugadores registrados en este juego.
                    </div>

                    <!-- Lista de jugadores -->
                    <div th:each="jugador : ${juego.jugadores}"
                         class="player-row">

                        <div>
                            <strong th:text="${jugador.nombre + ' ' + jugador.apellido}">
                                Nombre Apellido
                            </strong><br>

                            <small class="text-muted"
                                   th:text="${jugador.usuario}">
                                @usuario
                            </small>
                        </div>

                        <a th:href="@{/jugadores/perfil/{id}(id=${jugador.id})}"
                           class="btn btn-outline-light btn-sm">
                            Ver perfil
                        </a>

                    </div>

                </div>
            </div>

        </div>

    </div>

    </div>

</main>

<!-- Footer -->
<footer class="text-center py-3">
    <small>&copy; 2024 Game Project Zone</small>
</footer>

</body>
</html>
