<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crear Perfil | VideoGamesHub</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ======================
           GLOBAL
        ====================== */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ======================
           NAVBAR
        ====================== */
        .navbar {
            background: linear-gradient(90deg, #1a1a1a, #2d2d2d);
        }

        .navbar-brand i {
            color: #ff9800;
        }

        /* ======================
           HEADER SECTION
        ====================== */
        .page-header {
            padding: 120px 0 60px;
            background: url("https://picsum.photos/1920/600?gaming-profile") center/cover no-repeat;
            position: relative;
        }

        .page-header::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
        }

        .page-header-content {
            position: relative;
            z-index: 1;
        }

        /* ======================
           FORM CARD
        ====================== */
        .profile-card {
            background-color: #1f1f1f;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .form-control,
        .form-control:focus {
            background-color: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
        }

        .form-label {
            color: #bdbdbd;
        }

        /* ======================
           FOOTER
        ====================== */
        footer {
            background-color: #1f1f1f;
        }

        footer i {
            font-size: 1.3rem;
            margin-right: 10px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">
            <i class="fas fa-gamepad me-2"></i>VideoGamesHub
        </a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navbarMenu" class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/index}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Juegos</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
            </ul>
            <a th:href="@{/login}" class="btn btn-outline-warning">¡Conecta y juega!</a>
        </div>
    </div>
</nav>

<!-- HEADER -->
<section class="page-header text-center">
    <div class="container page-header-content">
        <h1 class="fw-bold">Editar Perfil</h1>
        <p class="lead">Personalizá tu identidad gamer</p>
    </div>
</section>

<!-- FORM -->
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card profile-card">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4">
                        <i class="fas fa-user-edit text-warning me-2"></i>Datos del Jugador
                    </h4>

                    <form th:action="@{/jugadores/guardar}" method="post">


                    <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" name="nombre"
                                   th:value="${jugador.nombre}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" class="form-control" name="apellido"
                                   th:value="${jugador.apellido}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email"
                                   th:value="${jugador.email}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" name="usuario"
                                   th:value="${jugador.usuario}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" name="password"
                                   placeholder="Cambiar contraseña (opcional)">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" name="fechaNacimiento"
                                   th:value="${jugador.fechaNacimiento}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" name="descripcion" rows="3"
                                      th:text="${jugador.descripcion}"></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning btn-lg">
                                <i class="fas fa-save me-2"></i>Guardar Cambios
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="pt-4 pb-3">
    <div class="container text-center">
        <p class="mb-0">&copy; 2024 VideoGamesHub. Todos los derechos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
