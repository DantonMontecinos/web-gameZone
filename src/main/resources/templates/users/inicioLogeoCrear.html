<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inicio | Página de Videojuegos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #121212; /* Negro neutro */
            color: #e0e0e0; /* Gris claro */
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Asegura que el body cubra toda la altura */
            margin: 0; /* Elimina márgenes por defecto */
        }

        .navbar {
            background-color: #1f1f1f; /* Gris oscuro */
        }

        .main-content {
            flex: 1; /* Hace que el contenido ocupe el espacio restante */
            margin-top: 20px;
        }

        .footer {
            background-color: #1f1f1f; /* Gris oscuro */
            color: #e0e0e0; /* Gris claro */
            padding: 20px 0;
            text-align: center;
        }

        .card {
            background-color: #282828;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">VideoGamesHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- Main Content -->



<div class="container main-content">
    <div class="text-center mb-4">
        <h1>Bienvenido a VideoGamesHub</h1>
        <p>Encuentra jugadores y amigos para tus juegos favoritos!</p>
    </div>

    <div class="text-center"  style="margin-top:20;">
        <a th:href="@{/login}" class="btn btn-primary me-2" >Iniciar Sesión</a>
        <a th:href="@{/crear}" class="btn btn-outline-secondary">Crear Nuevo Perfil</a>
    </div>
</div>

</div>


<!-- Footer -->
<footer class="footer mt-5">
    <div class="container">
        <p>&copy; 2024 VideoGamesHub. Todos los derechos reservados.</p>
    </div>
</footer>
</body>
</html>
